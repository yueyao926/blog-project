server {
    listen 80;
    server_name irisyueyao.top www.irisyueyao.top;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://irisyueyao.top$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name irisyueyao.top www.irisyueyao.top;

    ssl_certificate /etc/letsencrypt/live/irisyueyao.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/irisyueyao.top/privkey.pem;

    client_max_body_size 20M;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}